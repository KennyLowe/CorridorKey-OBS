# Reference clips for the quality/flicker evaluation (research D10).
# Nothing here is committed or rehosted. Public clips are downloaded from their source into the
# git-ignored footage/public/. HCW plates are downloaded by hand into footage/hcw/.
# Every clip is normalised to 1920x1080 at 30 fps (aspect kept, padded with screen green) and
# trimmed to min(300, available) frames.
#
# Licence summaries were checked on the source sites on 2026-10-16:
#  - Pexels licence: free to use and modify, no attribution needed; no redistribution on other
#    stock/wallpaper platforms; no selling unaltered copies.
#  - Pixabay Content License: free to use and adapt, no attribution needed; no standalone
#    redistribution/sale (i.e. where no creative effort has been applied).
#
# hint: "fixed" (default; research D8 thresholds) or "calibrated" (screen colour estimated per clip
# from the frame border; spec Session 2026-10-17). Calibrated is used only for the two Pexels clips,
# which are ungraded flat footage that the fixed hint does not recognise as green screen.
#
#  - Hollywood Camera Work plates (readme in the zips): "use the clips any way you want and post
#    the results anywhere"; MAY NOT redistribute or host the clips; MAY NOT sell them.

