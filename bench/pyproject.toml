[project]
name = "ckbench"
version = "0.1.0"
description = "Feasibility benchmark harness for live CorridorKey green-screen keying"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "CC-BY-NC-SA-4.0" }
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "timm==1.0.26",
    "safetensors==0.7.0",
    "onnx==1.23.2",
    "tensorrt-cu12==10.16.1.11",
    "nvidia-ml-py==13.615.71",
    "numpy==2.4.2",
    "opencv-python-headless==4.13.0.92",
    "jsonschema==4.26.0",
    "psutil==7.2.2",
    "pytest==9.1.1",
    "obsws-python==1.8.0",
    "websocket-client==1.9.2",
]

[project.scripts]
ckbench = "ckbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ckbench"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
